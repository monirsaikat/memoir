name: Release Memoir

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate tag and package release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          test "$tag" = "v$(tr -d '\r\n' < VERSION)" || {
            echo "Tag $tag does not match VERSION ($(cat VERSION))."
            exit 1
          }

          mkdir -p dist/package/memoir
          git archive HEAD | tar -x -C dist/package/memoir
          rm -rf dist/package/memoir/.github
          (
            cd dist/package
            zip -q -r "../memoir-v${version}.zip" memoir
          )
          (
            cd dist
            sha256sum "memoir-v${version}.zip" > "memoir-v${version}.zip.sha256"
          )

      - name: Attest release package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/memoir-*.zip
            dist/memoir-*.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/memoir-*.zip \
            dist/memoir-*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Memoir ${GITHUB_REF_NAME#v}"
